name: deploy web-app to github pages

on:
  push:
    branches:
      - main
      - claude/adhs-structure-app-vy33c3
    paths:
      - "app/**"
      - "mvp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # v0.4-beta bleibt unter der haupt-adresse, der neue mvp v2 liegt
      # daneben unter /mvp/ — so lassen sich beide vergleichen
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R app/. _site/
          mkdir -p _site/mvp
          cp -R mvp/. _site/mvp/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
